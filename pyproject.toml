[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scoring-model-validator"
version = "0.1.0"
description = "Research platform for independent validation of credit scoring models"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "scikit-learn",
    "matplotlib",
    "plotly",
    "fastapi",
    "uvicorn",  # без [standard]: uvloop/httptools/watchfiles часто не имеют колес под Python 3.14
    "python-multipart",
    "streamlit",
    "httpx",
]

[project.optional-dependencies]
# reportlab НЕ указываем здесь вообще: Poetry на Streamlit Cloud резолвит его даже как
# опциональный и падает на Python 3.14. PDF-экспорт работает там, где reportlab уже
# установлен отдельно (локально/CI); в облаке PDF мягко отключается.
dev = ["pytest"]
tracking = ["mlflow"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.poetry]
# Streamlit Cloud собирает pyproject через Poetry. Он не понимает
# [tool.setuptools.packages.find] и не находит пакет по имени проекта в src-layout.
# Явно указываем, что устанавливаемый пакет — это каталог src (импорты `from src...`).
packages = [{ include = "src" }]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
