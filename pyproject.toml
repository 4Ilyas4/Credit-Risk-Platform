[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scoring-model-validator"
version = "0.1.0"
description = "Research platform for independent validation of credit scoring models"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "scikit-learn",
    "matplotlib",
    "plotly",
    "reportlab>=4.0",  # 3.5.x не собирает C-расширение на Python 3.13/3.14 (Streamlit Cloud)
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "streamlit",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]
tracking = ["mlflow"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
