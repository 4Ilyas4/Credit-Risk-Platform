[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scoring-model-validator"
version = "0.1.0"
description = "Research platform for independent validation of credit scoring models"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "scikit-learn",
    "matplotlib",
    "plotly",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "streamlit",
    "httpx",
]

[project.optional-dependencies]
# reportlab нужен только для PDF-экспорта; на Python 3.14 облако не может собрать его
# C-расширение, поэтому он не входит в обязательные зависимости. PDF мягко отключается,
# а HTML/JSON-отчёты работают всегда.
dev = ["pytest", "reportlab>=4.0"]
pdf = ["reportlab>=4.0"]
tracking = ["mlflow"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
